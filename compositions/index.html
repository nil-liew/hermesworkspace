<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* ── Soft animated gradient background ── */
      .bg-gradient {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          #fce4ec 0%,
          #f3e5f5 25%,
          #e8eaf6 50%,
          #e0f2f1 75%,
          #fce4ec 100%
        );
        background-size: 400% 400%;
        animation: gradientShift 12s ease infinite;
      }

      @keyframes gradientShift {
        0%   { background-position: 0% 50%; }
        25%  { background-position: 100% 25%; }
        50%  { background-position: 100% 50%; }
        75%  { background-position: 0% 75%; }
        100% { background-position: 0% 50%; }
      }

      /* ── X Post Card ── */
      .card-wrap {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 720px;
        perspective: 1200px;
      }

      .x-card {
        position: relative;
        width: 100%;
        background: rgba(20, 20, 28, 0.92);
        backdrop-filter: blur(20px);
        border-radius: 24px;
        padding: 32px 32px 24px;
        box-shadow:
          0 8px 60px rgba(0, 0, 0, 0.35),
          0 0 0 1px rgba(255, 255, 255, 0.08);
        overflow: hidden;
        transform-style: preserve-3d;
      }

      /* Header */
      .post-header {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 16px;
      }

      .avatar {
        width: 48px;
        height: 48px;
        flex-shrink: 0;
        border-radius: 50%;
        background: linear-gradient(135deg, #6366f1, #a855f7);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 700;
        color: #fff;
      }

      .user-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
      }

      .name-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .display-name {
        font-size: 22px;
        font-weight: 700;
        color: #e7e9ea;
        line-height: 1.3;
      }

      .verified-badge {
        width: 20px;
        height: 20px;
      }

      .handle {
        font-size: 18px;
        color: #8b98a5;
        line-height: 1.3;
      }

      .x-logo {
        width: 28px;
        height: 28px;
        opacity: 0.6;
      }

      /* Tweet body */
      .tweet-body {
        font-size: 26px;
        font-weight: 400;
        color: #e7e9ea;
        line-height: 1.45;
        margin-bottom: 10px;
      }

      .tweet-body .hl {
        color: #a78bfa;
        font-weight: 500;
      }

      /* Shimmer sweep target */
      .shimmer-target {
        position: relative;
        display: inline;
      }

      .shimmer-target .shimmer-mask {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: linear-gradient(
          105deg,
          transparent 0%,
          transparent calc(var(--sp, -20%) - var(--sw, 25%) / 2),
          rgba(167, 139, 250, 0.55) var(--sp, -20%),
          transparent calc(var(--sp, -20%) + var(--sw, 25%) / 2),
          transparent 100%
        );
        mix-blend-mode: screen;
        border-radius: 4px;
      }

      /* Timestamp */
      .timestamp {
        font-size: 18px;
        color: #8b98a5;
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        margin-bottom: 14px;
      }

      /* Metrics */
      .metrics-bar {
        display: flex;
        align-items: center;
        gap: 0;
      }

      .metric {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 20px;
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        position: relative;
      }

      .metric:last-of-type {
        border-right: none;
      }

      .metric-icon {
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .metric-icon svg {
        width: 28px;
        height: 28px;
        display: block;
      }

      .metric-count {
        font-size: 18px;
        color: #8b98a5;
        font-variant-numeric: tabular-nums;
      }

      .like-btn {
        cursor: default;
      }

      /* ── Particles container ── */
      .particles-container {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      .particle {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        opacity: 0;
        will-change: transform, opacity;
      }

      /* Track indices */
      .bg-gradient { data-track-index: 0; }
      .card-wrap { data-track-index: 1; }
      .particles-container { data-track-index: 2; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="root"
      data-width="1080"
      data-height="1350"
      data-duration="10"
    >
      <!-- Background -->
      <div class="bg-gradient clip" data-start="0" data-duration="10" data-track-index="0"></div>

      <!-- Card -->
      <div class="card-wrap clip" data-start="0.2" data-duration="9.5" data-track-index="1">
        <div class="x-card" id="x-card">
          <!-- Header -->
          <div class="post-header">
            <div class="avatar">H</div>
            <div class="user-info">
              <div class="name-row">
                <span class="display-name">Hyperframes</span>
                <span class="verified-badge">
                  <svg viewBox="0 0 22 22" fill="none">
                    <circle cx="11" cy="11" r="11" fill="#1d9bf0" />
                    <path d="M9.5 14.25L6.25 11l1.06-1.06 2.19 2.19 4.69-4.69L15.25 8.5 9.5 14.25z" fill="#fff" />
                  </svg>
                </span>
              </div>
              <span class="handle">@hyperframes</span>
            </div>
            <div class="x-logo">
              <svg viewBox="0 0 24 24" fill="#e7e9ea">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
              </svg>
            </div>
          </div>

          <!-- Tweet body -->
          <div class="tweet-body">
            we render video from HTML now.
            <br />
            <span class="shimmer-target" id="shimmer-line">
              no timeline UI. <span class="hl">just code.</span>
              <div class="shimmer-mask"></div>
            </span>
          </div>

          <!-- Timestamp -->
          <div class="timestamp">2:41 PM &middot; Jul 10, 2026</div>

          <!-- Metrics -->
          <div class="metrics-bar">
            <div class="metric">
              <div class="metric-icon">
                <svg viewBox="0 0 24 24" fill="#8b98a5">
                  <path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z" />
                </svg>
              </div>
              <span class="metric-count">47</span>
            </div>
            <div class="metric">
              <div class="metric-icon">
                <svg viewBox="0 0 24 24" fill="#8b98a5">
                  <path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z" />
                </svg>
              </div>
              <span class="metric-count">892</span>
            </div>
            <div class="metric like-btn" id="like-metric">
              <div class="metric-icon">
                <svg viewBox="0 0 24 24">
                  <path id="heart-outline" d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91zm4.187 7.69c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z" fill="#8b98a5" />
                  <path id="heart-filled" d="M20.884 13.19c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z" fill="#f91880" opacity="0" />
                </svg>
              </div>
              <span id="like-count" class="metric-count">0</span>
            </div>
            <div class="metric">
              <div class="metric-icon">
                <svg viewBox="0 0 24 24" fill="#8b98a5">
                  <path d="M8.75 21V3h2v18h-2zM18 21V8.5h2V21h-2zM4 21l.004-10h2L6 21H4zm9.248 0v-7h2v7h-2z" />
                </svg>
              </div>
              <span class="metric-count">24.1K</span>
            </div>
          </div>

          <!-- Particles container -->
          <div class="particles-container" id="particles-container"></div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      const card = document.getElementById("x-card");
      const likeCount = document.getElementById("like-count");
      const heartOutline = document.getElementById("heart-outline");
      const heartFilled = document.getElementById("heart-filled");
      const shimmerLine = document.getElementById("shimmer-line");
      const particlesContainer = document.getElementById("particles-container");

      // ── Initial state: card off-screen below ──
      gsap.set(card, { y: 200, opacity: 0, rotationX: 8, rotationY: -5, scale: 0.95 });
      gsap.set(".bg-gradient", { opacity: 0 });

      // ── Beat 1 (0.3s): Background fades in ──
      tl.to(".bg-gradient", { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.3);

      // ── Beat 2 (0.5s): Card slides up ──
      tl.fromTo(card,
        { y: 200, opacity: 0, rotationX: 8, rotationY: -5, scale: 0.95 },
        { y: 0, opacity: 1, rotationX: 0, rotationY: 0, scale: 1, duration: 0.9, ease: "power3.out" },
        0.5
      );

      // ── Beat 3 (1.0s): Subtle 3D tilt as it settles ──
      tl.to(card, {
        rotationX: 3, rotationY: -2, scale: 1.01,
        duration: 0.5, ease: "power2.inOut", yoyo: true, repeat: 1
      }, 1.0);

      // ── Beat 4 (1.6s): Shimmer sweep across second sentence ──
      tl.fromTo(shimmerLine,
        { "--sp": "-20%" },
        { "--sp": "130%", duration: 1.0, ease: "power2.inOut" },
        1.6
      );

      // ── Beat 5 (2.2s): Like count starts ticking ──
      const likeTarget = 1200;
      let likeProxy = { val: 0 };
      tl.to(likeProxy, {
        val: likeTarget,
        duration: 1.5,
        ease: "power2.out",
        onUpdate: function () {
          const v = Math.round(likeProxy.val);
          likeCount.textContent = v >= 1000 ? (v / 1000).toFixed(1) + "K" : v.toString();
        }
      }, 2.2);

      // ── Beat 6 (3.2s): Heart pops + particle burst ──
      // Hide outline, show filled
      tl.to(heartOutline, { opacity: 0, duration: 0.05, ease: "none" }, 3.2);
      tl.to(heartFilled, { opacity: 1, duration: 0.05, ease: "none" }, 3.2);

      // Heart scale pop to 1.6×
      tl.to("#heart-filled", {
        scale: 1.6,
        duration: 0.15,
        ease: "power2.out",
        onStart: function () {
          // Spawn ~24 seeded particles
          spawnParticles();
        }
      }, 3.2);

      // Heart settles back
      tl.to("#heart-filled", {
        scale: 1.0,
        duration: 0.4,
        ease: "elastic.out(1, 0.5)",
      }, 3.35);

      // Like count turns pink
      tl.to(likeCount, { color: "#f91880", duration: 0.1, ease: "none" }, 3.2);

      // ── Beat 7 (4.5s+): Ambient breathing hold ──
      tl.to(card, {
        scale: 1.008,
        duration: 2.0,
        ease: "sine.inOut",
        yoyo: true,
        repeat: -1
      }, 4.5);

      // ── Particle system ──
      function spawnParticles() {
        const colors = ["#f91880", "#a855f7", "#6366f1", "#ec4899", "#f472b6", "#c084fc"];
        const centerX = 540; // half of 1080
        const centerY = 820; // approximate heart position (from bottom of card)

        for (let i = 0; i < 24; i++) {
          const p = document.createElement("div");
          p.className = "particle";
          const color = colors[i % colors.length];
          p.style.background = color;
          p.style.left = centerX + "px";
          p.style.top = centerY + "px";
          particlesContainer.appendChild(p);

          const angle = (i / 24) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
          const distance = 60 + Math.random() * 80;
          const tx = Math.cos(angle) * distance;
          const ty = Math.sin(angle) * distance - 20;

          gsap.fromTo(p,
            { scale: 0, opacity: 1, x: 0, y: 0 },
            {
              scale: 0.8 + Math.random() * 0.6,
              opacity: 0,
              x: tx,
              y: ty,
              duration: 0.7 + Math.random() * 0.3,
              ease: "power2.out",
              delay: Math.random() * 0.08,
              onComplete: () => p.remove()
            }
          );
        }
      }

      window.__timelines["root"] = tl;
    </script>
  </body>
</html>
