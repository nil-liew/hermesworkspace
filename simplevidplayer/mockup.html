<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SimpleVidPlayer — Mockup</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "SF Pro Text", Helvetica, sans-serif;
    background:#111; color:#e8e8e8;
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
  }
  /* fake macOS titlebar — no dots */
  .titlebar {
    height:34px; background:#1a1a1f; display:flex; align-items:center;
    padding:0 14px; font-size:12px; color:#888; border-bottom:1px solid #000;
    flex-shrink:0;
  }
  .main { flex:1; display:flex; min-height:0; }
  .video-area {
    flex:1; display:flex; align-items:center; justify-content:center;
    background:#000; position:relative;
  }
  .video-placeholder { color:#333; font-size:15px; letter-spacing:.5px; text-align:center; }
  .controls {
    height:56px; background:#16161b; border-top:1px solid #26262c;
    display:flex; align-items:center; gap:14px; padding:0 16px; flex-shrink:0;
  }
  button {
    background:none; border:none; color:#cfcfe6; cursor:pointer; font-size:16px;
    padding:6px 8px; border-radius:6px;
  }
  button:hover { background:#26262e; color:#fff; }
  .play-btn { font-size:20px; }
  .time { font-size:12px; color:#9a9ab0; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .seek { flex:1; accent-color:#a8c7fa; height:4px; }
  .spacer { flex:1; }
  .pl-toggle.active { color:#ffd9a8; background:#2a2430; }

  /* playlist panel */
  .playlist {
    width:280px; background:#14141a; border-left:1px solid #26262c;
    display:flex; flex-direction:column;
  }
  .playlist.hidden { display:none; }
  .playlist-head {
    padding:12px 14px; font-size:13px; font-weight:600; color:#cfcfe6;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid #22222a;
  }
  .playlist-actions { display:flex; gap:4px; }
  .playlist-actions button { font-size:12px; padding:3px 7px; }
  .plist { flex:1; overflow-y:auto; list-style:none; padding:6px; }
  .plist li {
    padding:8px 10px; font-size:12.5px; border-radius:6px; cursor:pointer;
    color:#b8b8cc; display:flex; gap:8px; align-items:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .plist li:hover { background:#1e1e26; }
  .plist li.playing { color:#ffd9a8; background:#251f18; }
  .plist li .idx { color:#666; font-variant-numeric:tabular-nums; min-width:18px; }
  .drop-hint {
    margin:auto; font-size:12px; color:#555; text-align:center; line-height:1.6;
    border:1px dashed #333; border-radius:10px; padding:24px 18px;
  }
  .note { font-size:11px; color:#555; padding:10px 14px; border-top:1px solid #22222a; }
</style>
</head>
<body>
  <div class="titlebar">SimpleVidPlayer</div>
  <div class="main">
    <div class="video-area">
      <div class="video-placeholder">▶︎ Video area<br><span style="font-size:11px">(VLCKit renders here)</span></div>
    </div>
    <div class="playlist" id="playlist">
      <div class="playlist-head">
        <span>Playlist</span>
        <span class="playlist-actions">
          <button onclick="addFiles()">＋ Add</button>
          <button onclick="clearList()">Clear</button>
        </span>
      </div>
      <ul class="plist" id="plist">
        <li class="drop-hint">Drop video files here<br>or click ＋ Add</li>
      </ul>
      <div class="note">Auto-advances to next file on end.</div>
    </div>
  </div>
  <div class="controls">
    <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
    <span class="time" id="tcur">00:00</span>
    <input type="range" class="seek" id="seek" value="0" max="1000" oninput="scrub()">
    <span class="time" id="tdur">00:00</span>
    <span class="spacer"></span>
    <button id="openBtn" onclick="addFiles()">📂 Open</button>
    <button class="pl-toggle active" id="plBtn" onclick="togglePl()">☰</button>
  </div>

<script>
let playing=false, playingIdx=-1, items=[];
function fmt(s){s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function togglePlay(){
  if(!items.length) return;
  playing=!playing;
  document.getElementById('playBtn').textContent = playing?'❚❚':'▶';
}
function scrub(){
  const v=document.getElementById('seek').value/1000*300;
  document.getElementById('tcur').textContent=fmt(v);
}
function addFiles(){
  const names=['movie-night.mkv','holiday.mp4','clip-01.mov','series-s01e02.avi'];
  names.forEach(n=>{ if(!items.includes(n)) items.push(n); });
  render();
}
function clearList(){ items=[]; playingIdx=-1; render(); togglePlayTo(false); }
function togglePlayTo(p){playing=p;document.getElementById('playBtn').textContent=p?'❚❚':'▶';}
function render(){
  const ul=document.getElementById('plist'); ul.innerHTML='';
  if(!items.length){ ul.innerHTML='<li class="drop-hint">Drop video files here<br>or click ＋ Add</li>'; return; }
  items.forEach((n,i)=>{
    const li=document.createElement('li');
    li.innerHTML='<span class="idx">'+(i+1)+'</span><span>'+n+'</span>';
    if(i===playingIdx){ li.classList.add('playing'); li.innerHTML+=' &nbsp;▸'; }
    li.onclick=()=>{ playingIdx=i; togglePlayTo(true); render();
      // demo: simulate duration
      document.getElementById('tdur').textContent='42:17'; };
    ul.appendChild(li);
  });
}
function togglePl(){
  document.getElementById('playlist').classList.toggle('hidden');
  document.getElementById('plBtn').classList.toggle('active');
}
// fake progress while "playing"
setInterval(()=>{
  if(!playing||playingIdx<0) return;
  const s=document.getElementById('seek');
  let v=(+s.value+2)%1000; s.value=v;
  document.getElementById('tcur').textContent=fmt(v/1000*300);
},200);
</script>
</body>
</html>
